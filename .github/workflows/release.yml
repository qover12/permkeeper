name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.1.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build module
        run: python3 build_zygisk.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/permkeeper-zygisk.zip
          generate_release_notes: true
